import com.liferay.gradle.plugins.patcher.PatchTask

apply plugin: "com.liferay.patcher"

task patch(type: PatchTask)

dependencies {
	compile group: "org.jasig.cas.client", name: "cas-client-core", version: "3.1.12"
}

patch {
	ext {
		autoClean = false
	}

	fileNames "org/jasig/cas/client/validation/AbstractUrlBasedTicketValidator.java"
	fileNames "org/jasig/cas/client/validation/Cas20ServiceTicketValidator.java"

	originalLibModuleName = "cas-client-core"
}